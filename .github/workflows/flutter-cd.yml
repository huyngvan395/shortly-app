
name: Shortly App CD

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: shortly-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Build Signed Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore environment file
        env:
          APP_ENV: ${{ secrets.APP_ENV }}
        run: |
          if [ -z "$APP_ENV" ]; then
            echo "::error::APP_ENV secret is missing."
            exit 1
          fi

          printf '%s' "$APP_ENV" > .env

          if [ ! -s .env ]; then
            echo "::error::.env file is empty."
            exit 1
          fi

          for key in \
            SUPABASE_URL \
            SUPABASE_ANON_KEY \
            CLOUDINARY_CLOUD_NAME \
            CLOUDINARY_API_KEY \
            CLOUDINARY_API_SECRET \
            OPENROUTER_API_KEY \
            AGORA_APP_ID
          do
            if ! grep -Eq "^${key}=.+" .env; then
              echo "::warning::Missing or empty environment variable: ${key}"
            fi
          done

          if ! grep -Eq '^AGORA_APP_CERTIFICATE=.+' .env && \
             ! grep -Eq '^AGORA_TEMP_TOKEN=.+' .env; then
            echo "::warning::Agora certificate and temporary token are both missing."
          fi

      - name: Restore Android release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          for name in \
            KEYSTORE_BASE64 \
            STORE_PASSWORD \
            KEY_PASSWORD \
            KEY_ALIAS
          do
            if [ -z "${!name}" ]; then
              echo "::error::Missing signing secret: ${name}"
              exit 1
            fi
          done

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode \
            > android/app/shortly-release.jks

          cat > android/key.properties <<EOF
          storePassword=${STORE_PASSWORD}
          keyPassword=${KEY_PASSWORD}
          keyAlias=${KEY_ALIAS}
          storeFile=shortly-release.jks
          EOF

          chmod 600 android/key.properties
          chmod 600 android/app/shortly-release.jks

          keytool -list \
            -keystore android/app/shortly-release.jks \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" > /dev/null

          echo "Release keystore restored successfully."

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Build Release APK
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          VERSION="${RELEASE_TAG#v}"

          flutter build apk \
            --release \
            --build-name="$VERSION" \
            --build-number="$BUILD_NUMBER"

      - name: Verify APK
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::Release APK was not generated."
            exit 1
          fi

          ls -lh "$APK"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Shortly App ${{ github.ref_name }}
          generate_release_notes: true
          files: build/app/outputs/flutter-apk/app-release.apk
