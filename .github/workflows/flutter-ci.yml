
name: Shortly App CI

on:
  push:
    branches:
      - master
      - "feat/**"
      - "feature/**"

  pull_request:
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Flutter Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.5"
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Create temporary environment file
        run: touch .env

      - name: Install dependencies
        run: flutter pub get

      - name: Run unit tests
        run: flutter test

      - name: Run Flutter Analyze
        id: analyze
        continue-on-error: true
        run: flutter analyze --no-pub

      - name: Report Flutter Analyze result
        if: always()
        env:
          ANALYZE_OUTCOME: ${{ steps.analyze.outcome }}
        run: |
          echo "## Flutter Analyze" >> "$GITHUB_STEP_SUMMARY"

          if [ "$ANALYZE_OUTCOME" = "failure" ]; then
            echo "⚠️ Analysis issues were found." >> "$GITHUB_STEP_SUMMARY"
            echo "This check is informational and does not block CI." >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=Flutter Analyze::Issues found. See the analyzer logs."
          else
            echo "✅ No analysis issues found." >> "$GITHUB_STEP_SUMMARY"
          fi
